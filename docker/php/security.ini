; Security Hardening against CVE-2026-109618, CVE-2026-109619 and Information Disclosure
; Hide PHP version banner from all HTTP headers
expose_php = Off

; Prevent error display to end users; log everything securely
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Mitigate memory leakage and stack trace sensitive data exposure
zend.exception_ignore_args = On
report_memleaks = On

; Enforce strict memory limits per request
memory_limit = 256M
max_execution_time = 120
max_input_time = 60
